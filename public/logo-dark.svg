<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" fill="none">
  <!-- Isotipo Emblem Group (Dark Version for Scrolled Light Header) -->
  <g transform="translate(10, 10)">
    <!-- Outer Square Frame L-Brackets -->
    <path d="M 5 5 L 60 5 L 60 12 L 12 12 L 12 125 L 60 125 L 60 132 L 5 132 Z" fill="#0F2137" />
    <path d="M 70 5 L 125 5 L 125 132 L 70 132 L 70 125 L 118 125 L 118 12 L 70 12 Z" fill="#C48B28" />

    <!-- Inner Monogram B (Dark Navy) -->
    <g transform="translate(18, 15)">
      <path d="M 12 10 L 52 10 C 68 10 78 18 78 30 C 78 40 70 47 58 50 C 74 53 82 62 82 76 C 82 92 68 100 48 100 L 12 100 L 12 88 L 24 88 L 24 22 L 12 22 Z M 24 45 L 48 45 C 58 45 64 40 64 30 C 64 20 58 18 48 18 L 24 18 Z M 24 88 L 46 88 C 58 88 66 82 66 72 C 66 62 58 57 46 57 L 24 57 Z" fill="#0F2137" />
      
      <!-- Balanza de la Justicia (Gold) -->
      <g transform="translate(20, 58)">
        <rect x="10" y="32" width="22" height="8" fill="#C48B28" />
        <path d="M 19 12 L 23 12 L 23 32 L 19 32 Z" fill="#C48B28" />
        <circle cx="21" cy="9" r="3.5" fill="#C48B28" />
        <path d="M 6 14 C 14 11 28 11 36 14 L 36 17 C 28 14 14 14 6 17 Z" fill="#C48B28" />
        <path d="M 6 16 L 1 26 L 11 26 Z" fill="#C48B28" />
        <path d="M 36 16 L 31 26 L 41 26 Z" fill="#C48B28" />
      </g>
    </g>
  </g>

  <!-- Typography Text Group (Dark Navy Text #0F2137 for Light Header) -->
  <g transform="translate(155, 0)">
    <!-- Line 1: ESTUDIO JURÍDICO -->
    <text x="0" y="42" fill="#0F2137" font-family="'Montserrat', sans-serif" font-weight="800" font-size="28" letter-spacing="2">ESTUDIO JURÍDICO</text>
    
    <!-- Line 2: BOBADILLA Y ASOCIADOS -->
    <text x="0" y="80" fill="#0F2137" font-family="'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="1">BOBADILLA Y ASOCIADOS</text>
    
    <!-- Divider Line -->
    <line x1="0" y1="96" x2="490" y2="96" stroke="#0F2137" stroke-width="2.5" />
    
    <!-- Line 3: Slogan -->
    <text x="0" y="123" fill="#0F2137" font-family="'Montserrat', 'Inter', sans-serif" font-weight="600" font-size="18" letter-spacing="0.5">El aliado legal que tú y tu empresa necesitan</text>
  </g>
</svg>
