    <text x="0" y="46" fill="#1B3A6B" font-family="'Montserrat', 'Roboto', sans-serif" font-weight="900" font-size="30" letter-spacing="0.5">CHAVEZ, PRADO,</text>
    <text x="0" y="82" fill="#1B3A6B" font-family="'Montserrat', 'Roboto', sans-serif" font-weight="900" font-size="30" letter-spacing="0.5">MENDOZA &amp; SALDAÑA</text>
    <text x="2" y="112" fill="#E8A33D" font-family="'Montserrat', 'Roboto', sans-serif" font-weight="600" font-size="16" letter-spacing="6">ABOGADOS</text>
  </g>
</svg>
