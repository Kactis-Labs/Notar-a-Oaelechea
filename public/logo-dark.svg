<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <style>
      .mp-text-top-dark {
        font-family: 'Playfair Display', serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.22em;
        fill: #0A0D12;
        text-transform: uppercase;
      }
      .mp-text-bot-dark {
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.38em;
        fill: #374151;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- MP Block Emblem - Monochrome Black & White -->
  <g transform="translate(195, 10)">
    <!-- Main Black Square -->
    <rect x="0" y="0" width="110" height="110" fill="#000000" rx="3" />
    
    <!-- Vertical White Gap Line -->
    <line x1="55" y1="0" x2="55" y2="110" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- White Letter M on Left -->
    <text x="28" y="76" font-family="'Playfair Display', serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>

    <!-- White Letter P on Right -->
    <text x="82" y="76" font-family="'Playfair Display', serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
  </g>

  <!-- Typography Below (Dark Charcoal & Slate) -->
  <text x="250" y="165" text-anchor="middle" class="mp-text-top-dark">MEDINA DE LA PAZ</text>
  <text x="250" y="198" text-anchor="middle" class="mp-text-bot-dark">CONSULTORES</text>
</svg>
