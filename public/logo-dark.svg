    <!-- Top-Right Diamond (Corporate Blue) -->
    <polygon points="58,28 80,50 58,72 36,50" fill="#0072CE" />
    
    <!-- Bottom-Left Diamond (Dark Navy) -->
    <polygon points="30,56 52,78 30,100 8,78" fill="#1B3A6B" />
    
    <!-- Bottom-Right Diamond (Deep Navy) -->
