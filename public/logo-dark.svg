<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <style>
      .mp-text-top {
        font-family: 'Playfair Display', serif;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.22em;
        fill: #0A0D12;
        text-transform: uppercase;
      }
      .mp-text-bot {
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.38em;
        fill: #EA580C;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- MP Block Emblem Faithful Recreation -->
  <g transform="translate(195, 10)">
    <!-- Main Black Background Block -->
    <rect x="0" y="0" width="110" height="110" fill="#0A0D12" rx="4" />
    
    <!-- Vertical Split Line in Orange Accent -->
    <line x1="55" y1="0" x2="55" y2="110" stroke="#EA580C" stroke-width="2.5" />
    
    <!-- M on Left Side -->
    <text x="28" y="76" font-family="'Playfair Display', serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>

    <!-- P on Right Side -->
    <text x="82" y="76" font-family="'Playfair Display', serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
  </g>

  <!-- Typography Below -->
  <text x="250" y="165" text-anchor="middle" class="mp-text-top">MEDINA DE LA PAZ</text>
  <text x="250" y="198" text-anchor="middle" class="mp-text-bot">CONSULTORES</text>
</svg>
