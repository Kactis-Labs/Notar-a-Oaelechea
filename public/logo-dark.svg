    <!-- Outer Chevron Frame (Dark Navy #0A1118) -->
    <path d="M 10 10 L 90 10 L 90 28 L 28 28 L 28 90 L 10 90 Z" fill="#0A1118" />
    
    <!-- Inner Stylized "F" Block (Deep Navy #0A2540) -->
    <path d="M 40 40 L 90 40 L 90 54 L 56 54 L 56 66 L 82 66 L 82 78 L 56 78 L 56 96 L 40 96 Z" fill="#0A2540" />
  </g>

  <!-- Typography Text Group (Dark Navy Text for Light Header) -->
  <g transform="translate(125, 0)">
    <text x="0" y="62" fill="#0A2540" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="40" letter-spacing="4">FOURNIER</text>
    <text x="2" y="98" fill="#0A2540" font-family="'Montserrat', 'Inter', sans-serif" font-weight="600" font-size="18" letter-spacing="9" opacity="0.9">ABOGADOS</text>
  </g>
