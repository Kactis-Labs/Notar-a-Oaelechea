<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" fill="none">
  <!-- Monogram "EU" Serif Emblem in Petrol Blue -->
  <g transform="translate(225, 0)">
    <!-- Letter E -->
    <text x="-32" y="48" fill="#1B3A57" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="52">E</text>
    <!-- Letter U (desplazada a la derecha y un poco más abajo) -->
    <text x="4" y="58" fill="#1B3A57" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="52">U</text>
  </g>
  
  <!-- Line Divider -->
  <line x1="40" y1="84" x2="410" y2="84" stroke="#1B3A57" stroke-width="2" opacity="0.9" />
  
  <!-- Main Name Text -->
  <text x="225" y="78" text-anchor="middle" fill="#1B3A57" font-family="'Montserrat', 'Oswald', sans-serif" font-weight="700" font-size="20" letter-spacing="2">ESCALANTE, ULLOA &amp; ASOCIADOS</text>
  
  <!-- Subtitle Text -->
  <text x="225" y="108" text-anchor="middle" fill="#1B3A57" font-family="'Montserrat', sans-serif" font-weight="600" font-size="14" letter-spacing="4" opacity="0.9">ESTUDIO JURÍDICO</text>
</svg>
