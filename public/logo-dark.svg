<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" fill="none">
  <!-- Group Centered -->
  <g transform="translate(10, 0)">
    <!-- Word 1: Ocampos (Left) -->
    <text x="15" y="76" fill="#8A6A3D" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="700" font-size="58" letter-spacing="0">Ocampos</text>
    
    <!-- Central Ornate Ampersand "&" -->
    <text x="278" y="86" fill="#8A6A3D" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="800" font-size="105">&amp;</text>
    
    <!-- Word 2: Sifuentes (Right) -->
    <text x="382" y="76" fill="#8A6A3D" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="700" font-size="58" letter-spacing="0">Sifuentes</text>
    
    <!-- Subtitle: ABOGADOS (Bottom Center) -->
    <text x="340" y="118" text-anchor="middle" fill="#1F1B16" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="19" letter-spacing="8">ABOGADOS</text>
  </g>
</svg>
