<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" fill="none">
  <defs>
    <!-- Metallic Bronze Gradient -->
    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A6A3D" />
      <stop offset="50%" stop-color="#C9A468" />
      <stop offset="100%" stop-color="#8A6A3D" />
    </linearGradient>
  </defs>

  <!-- Group Centered -->
  <g transform="translate(10, 0)">
    <!-- Word 1: Ocampos (Left) -->
    <text x="15" y="70" fill="url(#bronzeGradient)" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="700" font-size="52" letter-spacing="1">Ocampos</text>
    
    <!-- Central Ornate Ampersand "&" (Large & Distinctive) -->
    <text x="275" y="85" fill="url(#bronzeGradient)" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="700" font-size="108">&amp;</text>
    
    <!-- Word 2: Sifuentes (Right) -->
    <text x="385" y="70" fill="url(#bronzeGradient)" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="700" font-size="52" letter-spacing="1">Sifuentes</text>
    
    <!-- Subtitle: ABOGADOS (Bottom Center) -->
    <text x="340" y="118" text-anchor="middle" fill="url(#bronzeGradient)" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="20" letter-spacing="6">ABOGADOS</text>
  </g>
</svg>
