<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="820" height="120">
  <defs>
    <style>
      .pcva-gold { fill: #E5A83B; }
      .pcva-gray { fill: #555555; }
      .pcva-white { fill: #FFFFFF; }
      .pcva-line { stroke: #E5A83B; stroke-width: 2.5; }
      .pcva-text-top {
        font-family: 'Montserrat', sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .pcva-text-bot {
        font-family: 'Montserrat', sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Isotipo PCVA Geometric Logo -->
  <g transform="translate(10, 10)">
    <!-- P -->
    <path class="pcva-gold" d="M 0 0 H 45 C 65 0 65 36 45 36 H 22 V 100 H 0 Z M 22 18 H 42 C 48 18 48 18 42 18 Z" />
    <!-- C -->
    <path class="pcva-gold" d="M 35 36 C 50 18 80 18 95 36 C 110 54 100 82 85 96 C 65 106 35 90 28 72 H 52 C 55 78 68 84 76 78 C 84 72 86 58 78 48 C 70 38 52 42 48 48 Z" opacity="0.9" />
    <!-- V -->
    <path class="pcva-gold" d="M 75 0 L 115 100 H 138 L 178 0 H 152 L 126 70 L 100 0 Z" />
    <!-- A -->
    <path class="pcva-gray" fill="#777777" d="M 145 100 L 185 0 H 208 L 248 100 H 224 L 216 80 H 176 L 168 100 Z M 184 60 H 208 L 196 28 Z" />
    <line x1="210" y1="65" x2="242" y2="65" stroke="#FFFFFF" stroke-width="3" />
    <line x1="212" y1="72" x2="240" y2="72" stroke="#FFFFFF" stroke-width="3" />
    <line x1="214" y1="79" x2="238" y2="79" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Vertical Divider Line -->
  <line x1="285" y1="12" x2="285" y2="108" class="pcva-line" />

  <!-- Typography Text White -->
  <g transform="translate(315, 0)">
    <text x="0" y="52" class="pcva-text-top pcva-white">PÉREZ CAPURRO VÁSQUEZ</text>
    <text x="0" y="94" class="pcva-text-bot pcva-white">y ALVARADO ABOGADOS</text>
  </g>
</svg>
