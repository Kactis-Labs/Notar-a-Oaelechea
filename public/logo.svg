<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="400" height="170">
  <defs>
    <style>
      .mp-text-top {
        font-family: 'Playfair Display', serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.18em;
        fill: #FFFFFF;
        text-transform: uppercase;
      }
      .mp-text-bot {
        font-family: 'Montserrat', sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.35em;
        fill: #E5E7EB;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- MP Block Emblem - Tight Tightly Cropped & Scaled -->
  <g transform="translate(155, 0)">
    <!-- Main Black Square -->
    <rect x="0" y="0" width="90" height="90" fill="#000000" rx="3" />
    
    <!-- Vertical White Gap Line -->
    <line x1="45" y1="0" x2="45" y2="90" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- White Letter M on Left -->
    <text x="23" y="63" font-family="'Playfair Display', serif" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>

    <!-- White Letter P on Right -->
    <text x="67" y="63" font-family="'Playfair Display', serif" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
  </g>

  <!-- Typography Below -->
  <text x="200" y="132" text-anchor="middle" class="mp-text-top">MEDINA DE LA PAZ</text>
  <text x="200" y="158" text-anchor="middle" class="mp-text-bot">CONSULTORES</text>
</svg>
