<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- Geometric "S" Symbol -->
  <g transform="translate(12, 10)">
    <!-- Orange left vertical bar -->
    <line x1="26" y1="30" x2="26" y2="76" stroke="#F2994A" stroke-width="13" stroke-linecap="round" />
    
    <!-- Green diagonal bar (up-right) -->
    <line x1="32" y1="50" x2="76" y2="18" stroke="#6FCF54" stroke-width="13" stroke-linecap="round" />
    
    <!-- Coral Red diagonal bar (down-left) -->
    <line x1="64" y1="42" x2="24" y2="84" stroke="#EB5757" stroke-width="13" stroke-linecap="round" />
    
    <!-- Teal right vertical bar -->
    <line x1="76" y1="20" x2="76" y2="64" stroke="#20B2AA" stroke-width="13" stroke-linecap="round" />
  </g>
  
  <!-- Text Brand -->
  <text x="135" y="62" fill="#FFFFFF" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="800" font-size="34" letter-spacing="2.5">SOLUTIA</text>
  <text x="136" y="90" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="600" font-size="13.5" letter-spacing="4.5" opacity="0.95">LEGAL PARTNERS</text>
</svg>
