<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <!-- Geometric Pillar & "B" Emblem -->
  <g transform="translate(15, 12)">
    <!-- Top Capital Line -->
    <path d="M 22 24 L 92 24" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    
    <!-- Volute Scroll & B Loops -->
    <!-- Left Volute & Pillar Line 1 -->
    <path d="M 38 24 C 20 24 16 36 28 44 C 38 48 48 48 48 60 L 48 108" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Pillar Line 2 -->
    <line x1="33" y1="52" x2="33" y2="108" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
    
    <!-- Letter B Loops -->
    <!-- Top Loop -->
    <path d="M 48 24 C 85 24 88 64 48 64" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Bottom Loop -->
    <path d="M 48 64 C 92 64 95 108 33 108" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Typography Text Group -->
  <g transform="translate(130, 0)">
    <text x="0" y="50" fill="#FFFFFF" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="34" letter-spacing="4">BARBA &amp;</text>
    <text x="0" y="88" fill="#FFFFFF" font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="34" letter-spacing="4">ASOCIADOS</text>
    <text x="2" y="118" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="600" font-size="16" letter-spacing="5" opacity="0.9">ESTUDIO JURÍDICO</text>
  </g>
</svg>
