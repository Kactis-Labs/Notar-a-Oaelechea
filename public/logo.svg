<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 140" fill="none">
  <!-- Monogram "EU" Interlocked Serif Emblem -->
  <g transform="translate(180, 5)">
    <!-- Letter E (Serif) -->
    <text x="-18" y="52" fill="#FFFFFF" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="58" letter-spacing="-1">E</text>
    <!-- Letter U (Serif, interlocked right) -->
    <text x="6" y="60" fill="#FFFFFF" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-weight="700" font-size="58" letter-spacing="-1">U</text>
  </g>
  
  <!-- Line Divider -->
  <line x1="40" y1="84" x2="410" y2="84" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  
  <!-- Main Name Text -->
  <text x="225" y="78" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', 'Oswald', sans-serif" font-weight="700" font-size="20" letter-spacing="2">ESCALANTE, ULLOA &amp; ASOCIADOS</text>
  
  <!-- Subtitle Text -->
  <text x="225" y="108" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-weight="600" font-size="14" letter-spacing="4" opacity="0.9">ESTUDIO JURÍDICO</text>
</svg>
